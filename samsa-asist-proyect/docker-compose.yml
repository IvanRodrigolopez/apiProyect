version: '3.8'

services:
  # Contenedor de la API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pase_lista_api
    ports:
      - "5108:8080" # Mapea el puerto 5108 de tu PC al 8080 del contenedor
    environment:
      # 👇 Cadena de conexión para Docker (usando el nombre del servicio 'db')
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=samsaproyecto;User=root;Password=root_password;
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      # 👇 IMPORTANTE: Guardar las fotos en el disco del servidor y no dentro del contenedor
      - ./wwwroot/images:/app/wwwroot/images
    depends_on:
      - db
    restart: unless-stopped

  # Contenedor de MySQL
  db:
    image: mysql:8.0
    container_name: pase_lista_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: samsaproyecto
    ports:
      - "3307:3306" # Usamos 3307 en el host para no chocar con tu MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: